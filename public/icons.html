<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みそアイコン試作</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #F5F0E8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 48px;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 1.2rem;
      color: #5C3A00;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .label {
      font-size: 0.85rem;
      color: #8C5A00;
      text-align: center;
      line-height: 1.5;
    }
    .label strong {
      display: block;
      font-size: 1rem;
      color: #4A2800;
      margin-bottom: 4px;
    }
    .sizes {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .on-dark {
      background: #2A1800;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .size-label {
      font-size: 0.7rem;
      color: #B07040;
      text-align: center;
      margin-top: 4px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 48px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    hr {
      width: 100%;
      border: none;
      border-top: 1px solid #E0D0B0;
    }
  </style>
</head>
<body>

<h1>みそアイコン試作 — 麹菌 / 酵母菌</h1>

<!-- 麹菌 -->
<div class="card">
  <div class="label">
    <strong>麹菌（Aspergillus oryzae）</strong>

        </defs>
        <line x1="50" y1="61" x2="50" y2="85" stroke="#8C3000" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="50" cy="87" rx="9" ry="4" fill="#8C3000"/>
        <circle cx="50" cy="33" r="5"   fill="url(#k_s1)"/>
        <circle cx="50" cy="24" r="3.5" fill="url(#k_s2)"/>
        <circle cx="50" cy="17" r="2.5" fill="url(#k_s3)"/>
        <circle cx="65" cy="42" r="5"   fill="url(#k_s1)"/>
        <circle cx="73" cy="37" r="3.5" fill="url(#k_s2)"/>
        <circle cx="79" cy="34" r="2.5" fill="url(#k_s3)"/>
        <circle cx="65" cy="58" r="5"   fill="url(#k_s1)"/>
        <circle cx="73" cy="63" r="3.5" fill="url(#k_s2)"/>
        <circle cx="79" cy="67" r="2.5" fill="url(#k_s3)"/>
        <circle cx="35" cy="58" r="5"   fill="url(#k_s1)"/>
        <circle cx="27" cy="63" r="3.5" fill="url(#k_s2)"/>
        <circle cx="21" cy="67" r="2.5" fill="url(#k_s3)"/>
        <circle cx="35" cy="42" r="5"   fill="url(#k_s1)"/>
        <circle cx="27" cy="37" r="3.5" fill="url(#k_s2)"/>
        <circle cx="21" cy="34" r="2.5" fill="url(#k_s3)"/>

  <hr>

  <!-- ダーク背景 -->

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
        <use href="#koji"/>
      </svg>
    </div>
  </div>
</div>

<!-- 酵母菌 -->
<div class="card">
  <div class="label">
    <strong>酵母菌（Saccharomyces cerevisiae）</strong>
